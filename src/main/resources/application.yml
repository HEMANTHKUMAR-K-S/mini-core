spring:
  config:
    import: "file:C:/Users/Solum_BLR_IND/Desktop/externalConfig/application.properties"

  application:
    name: minicore

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}

server:
  port: 8080

rabbitmq:
  exchange:
    name: ${rabbitmq.exchange.name}
    type: ${rabbitmq.exchange.type}

batch:
  processing:
    fetch:
      job-size: 50

app:
  rabbitmq:
    initialize: false