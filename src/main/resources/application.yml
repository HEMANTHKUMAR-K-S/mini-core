spring:
  config:
    import: "file:C:/Users/Solum_BLR_IND/Desktop/externalConfig/application.properties"

  application:
    name: minicore

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

server:
  port: 8080

rabbitmq:
  queue :
   name : miniCore.queue
  exchange:
    name: ${rabbitmq.exchange.name}
    type: ${rabbitmq.exchange.type}

batch:
  processing:
    fetch:
      job-size: 50

    retry:
      exceptions:
        - name: org.springframework.dao.TransientDataAccessException
          max-attempts: 3
          delay: 3000

        - name: org.springframework.dao.OptimisticLockingFailureException
          max-attempts: 3
          delay: 2000

        - name: java.net.SocketTimeoutException
          max-attempts: 2
          delay: 1000

        - name: java.net.ConnectException
          max-attempts: 3
          delay: 3000

        - name: java.util.concurrent.TimeoutException
          max-attempts: 3
          delay: 2000

        - name: org.springframework.amqp.AmqpException
          max-attempts: 3
          delay: 5000

app:
  rabbitmq:
    initialize: false